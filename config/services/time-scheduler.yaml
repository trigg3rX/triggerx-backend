# Time Scheduler Service Configuration
# This file contains non-sensitive configuration settings
# Sensitive values (API keys, passwords, etc.) are loaded from .env

polling:
  interval: "30s"                      # Polling interval
  look_ahead: "40s"                    # Polling look ahead
  batch_size: 15                        # Batch size
  performer_lock_ttl: "31s"             # Performer lock TTL
  task_cache_ttl: "1m"                  # Task cache TTL
  duplicate_task_window: "1m"           # Duplicate task window
